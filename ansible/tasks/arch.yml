---
- name: Install packages
  community.general.pacman:
    name:
      - bat # A cat(1) clone with wings.
      - bmon # bandwidth monitor
      - base-devel # build toolchain (build-essential equivalent)
      - cloc
      - cronie # cron daemon, not installed/enabled by default on Arch
      - curl
      - fd # fd-find on Debian, package (and binary) is just "fd" here
      - fzf # command-line fuzzy finder
      - git
      - git-lfs # Git Large File Storage
      - graphviz # e.g. 'dot' command
      - htop
      - httrack # website copier, better than recursive wget
      - imagemagick
      - jq
      - ncdu # shows disk usage
      - neovim
      - openssl
      - pass
      - python-pipx
      - pv # shows progress of data through a pipeline
      - readline
      # renameutils intentionally omitted: it conflicts with imv (Omarchy's
      # default image viewer) in the Arch/omarchy repos - not worth trading
      # away the image viewer for qmv/qcp.
      - ripgrep # used, used by fzf
      - shellcheck
      - sqlite
      - the_silver_searcher # silversearcher-ag on Debian
      - tig
      - tmux
      - tree
      - unzip
      - vim
      - zlib
      - zsh
    update_cache: yes
    state: present
  become: true

- name: Enable and start cronie
  ansible.builtin.systemd:
    name: cronie.service
    enabled: true
    state: started
  become: true

# NOTE: no Arch equivalent wired up yet for the Debian snap packages
# (glances, powershell) - would need an AUR helper. Skipped for now.

- name: Install jrnl using pipx
  ansible.builtin.command: pipx install jrnl
  register: pipx_result
  changed_when: "'installed package' in pipx_result.stdout"
  failed_when: pipx_result.rc != 0

- name: Create .local/bin directory in user's home if it doesn't exist
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: '0755'
    force: no

- name: Install tools directly from GitHub releases
  unarchive:
    src: "{{ item.url }}"
    dest: "{{ ansible_env.HOME }}/.local/bin"
    mode: '0755'
    remote_src: yes
  loop:
    - url: https://github.com/Wilfred/difftastic/releases/download/0.61.0/difft-x86_64-unknown-linux-gnu.tar.gz
    - url: https://github.com/JohnnyMorganz/StyLua/releases/download/v2.0.0/stylua-linux-x86_64.zip

- name: Generate en_US.UTF-8 locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?en_US\.UTF-8 UTF-8'
    line: 'en_US.UTF-8 UTF-8'
  become: true
  register: locale_gen_conf

- name: Run locale-gen
  ansible.builtin.command: locale-gen
  become: true
  when: locale_gen_conf.changed

- name: Ensure default shell is zsh for "{{ ansible_user_id }}"
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/zsh
  become: true

# asdf

- name: Include asdf tasks (shared with Debian)
  include_tasks: asdf-linux.yml

# Omarchy / Hyprland
#
# Only the keyboard layout override is linked here, not the whole ~/.config/hypr
# directory - the rest (bindings, monitors, ...) is machine-specific and left
# as plain files managed directly by Omarchy.

- name: Ensure ~/.config/hypr directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/hypr"
    state: directory

- name: Symlink Hyprland keyboard layout override
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/.config/hypr/input.lua"
    dest: "{{ ansible_env.HOME }}/.config/hypr/input.lua"
    state: link
    force: yes
